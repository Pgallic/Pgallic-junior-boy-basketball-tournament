<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junior Boy Basketball Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style id="app-style">
/* Layout idea: the gym at night. An LED ribbon board up top, a hardwood center-court hero, then quiet navy panels for groups, the bracket and setup. */
:root{
  --court:#0c1524;
  --panel:#142036;
  --panel-2:#1a2942;
  --line:#2a3c5a;
  --ink:#eef2f8;
  --muted:#93a3bf;
  --orange:#ff7a1a;
  --led:#ffb43a;
  --gold:#ffc64a;
  --win:#3fd39a;
  --loss:#ff6b6b;
  --display:'Big Shoulders Display','Oswald','Arial Narrow',Impact,sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--court);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* Ribbon board */
.ribbon{position:relative;overflow:hidden;background:#04070d;height:40px;display:flex;align-items:center;border-bottom:1px solid #000}
.ribbon::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.5) .8px,transparent 1.3px);background-size:3px 3px}
.ribbon-track{display:flex;width:max-content;animation:ribbon 40s linear infinite}
.rseq{display:flex;align-items:center}
.ri{font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.13em;text-transform:uppercase;color:var(--led);text-shadow:0 0 7px rgba(255,180,58,.65);white-space:nowrap;padding:0 22px}
.ri.hot{color:#fff;text-shadow:0 0 7px rgba(255,255,255,.5)}
.rsep{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);flex:none}
@keyframes ribbon{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(12,21,36,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.nav{display:flex;gap:2px}
.nav a{font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px}
.nav a:hover{color:var(--ink);background:var(--panel-2)}
.save-status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.save-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save-status[data-s="saved"]::before{background:var(--win)}
.save-status[data-s="saving"]::before,.save-status[data-s="connecting"]::before{background:var(--led);animation:pulse 1s ease-in-out infinite}
.save-status[data-s="local"]::before{background:var(--led)}
.save-status[data-s="error"]::before{background:var(--loss)}
@keyframes pulse{50%{opacity:.25}}

/* Hero: center court */
.hero{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:50px 16px 86px;
  background:
    radial-gradient(120% 75% at 50% -12%,rgba(255,255,255,.30),transparent 60%),
    radial-gradient(140% 90% at 50% 125%,rgba(70,30,0,.38),transparent 62%),
    repeating-linear-gradient(180deg,rgba(255,240,215,.06) 0 1px,transparent 1px 3px,rgba(90,45,10,.06) 3px 4px,transparent 4px 7px),
    repeating-linear-gradient(180deg,#d6a466 0 27px,#a86f34 27px 28px,#cb9454 28px 55px,#a86f34 55px 56px,#dcab6c 56px 83px,#a86f34 83px 84px,#c78d4c 84px 111px,#a86f34 111px 112px,#d19c5c 112px 139px,#a86f34 139px 140px);
  box-shadow:inset 0 -7px 0 var(--orange)}
.court{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero h1{margin:0;font-family:var(--display);text-transform:uppercase;color:#0c1524;line-height:.86;display:flex;flex-direction:column;align-items:center;gap:12px}
.hero .l1{font-size:clamp(56px,12.5vw,156px);font-weight:900;letter-spacing:.005em;text-shadow:0 1px 0 rgba(255,255,255,.28);text-wrap:balance}
.hero .l2{font-size:clamp(16px,3.3vw,40px);font-weight:800;letter-spacing:.16em;background:#0c1524;color:#fff;padding:.3em .5em .24em .66em;border-radius:4px;box-shadow:0 4px 0 var(--orange)}
.hero-stats{margin-top:30px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.stat{background:#0a111d;border-radius:10px;padding:10px 16px 9px;min-width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 12px 24px -10px rgba(50,22,0,.6),inset 0 0 0 1px rgba(255,255,255,.07)}
.stat b{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:var(--led);text-shadow:0 0 10px rgba(255,180,58,.55);font-variant-numeric:tabular-nums}
.stat b small{font-size:.55em;color:rgba(255,180,58,.6)}
.stat span{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-champ{margin-top:18px;display:inline-flex;align-items:center;gap:10px;background:#0c1524;color:var(--gold);padding:8px 18px;border-radius:999px;font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.hero-champ svg{width:22px;height:22px}

/* Gym info */
.info{position:relative;z-index:2;max-width:1180px;margin:-38px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.info-card{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:0 18px 36px -14px rgba(0,0,0,.6)}
.info-icon{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(255,122,26,.13);color:var(--orange)}
.info-icon svg{width:36px;height:36px}
.info-card h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.info-card p{margin:4px 0 0;font-family:var(--label);font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--led)}

/* Callouts */
.callout-wrap{max-width:1180px;margin:22px auto 0;padding:0 16px}
.callout{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;border-radius:14px;padding:16px 18px;background:repeating-linear-gradient(-45deg,rgba(255,122,26,.07) 0 10px,transparent 10px 20px),var(--panel);border:1px solid rgba(255,122,26,.45)}
.callout .num{font-family:var(--display);font-weight:900;font-size:46px;line-height:.9;color:var(--orange);min-width:44px;text-align:center}
.callout .txt{flex:1 1 300px}
.callout strong{display:block;font-size:17px}
.callout p{margin:2px 0 0;color:var(--muted);font-size:15px}
.callout.ro{background:var(--panel);border-color:var(--line)}

/* Sections */
.section{max-width:1180px;margin:0 auto;padding:56px 16px 8px;scroll-margin-top:60px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 32px;flex-wrap:wrap;margin-bottom:22px}
.section-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(38px,5.4vw,60px);line-height:.9;text-transform:uppercase;text-wrap:balance}
.section-head p{margin:0;max-width:54ch;color:var(--muted)}
.footnote{margin:16px 0 0;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 22px}
.footnote b{color:var(--ink);font-weight:600}

/* Group cards */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.group-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,122,26,.13),transparent 65%)}
.g-letter{font-family:var(--display);font-weight:900;font-size:58px;line-height:.78;color:var(--orange);min-width:34px;text-align:center}
.group-head h3{margin:0;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;margin-top:5px;font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chip.done{color:#1a0d02;background:var(--led);border-color:var(--led)}
.table-wrap{overflow-x:auto}
.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.standings th{font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px 7px;white-space:nowrap}
.standings td{padding:11px 10px;border-top:1px solid var(--line);text-align:right;font-weight:600;font-size:15.5px}
.standings .team{text-align:left;width:100%}
.standings td.team{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.standings .rk{width:40px;text-align:center}
.standings td.rk{font-family:var(--display);font-weight:800;font-size:21px;color:var(--muted)}
.standings tr.adv td.rk{color:var(--orange);box-shadow:inset 4px 0 0 var(--orange)}
.standings tr.cut td{border-top:2px dashed rgba(255,122,26,.55)}
.standings .pd{min-width:58px}
.standings td.pd.pos{color:var(--win)}
.standings td.pd.neg{color:var(--loss)}
.qbadge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#1a0d02;font-family:var(--label);font-weight:700;font-size:12px;margin-left:8px;vertical-align:2px}
.games-head{padding:14px 18px 0;font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.games{padding:10px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* Game box (group games and bracket matches) */
.game{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tag{font-family:var(--label);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:rgba(147,163,191,.12);color:var(--muted)}
.tag.final{background:rgba(255,180,58,.15);color:var(--led)}
.tag.edit{background:rgba(255,122,26,.18);color:var(--orange)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:40px}
.tname{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.line.win .tname{font-weight:700;color:#fff}
.line.lose .tname{color:var(--muted)}
.tbd{color:var(--muted);font-style:italic;font-weight:500}
.seed{display:inline-block;font-family:var(--label);font-weight:700;font-style:normal;font-size:11.5px;letter-spacing:.05em;color:var(--orange);border:1px solid rgba(255,122,26,.5);border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:1px}
.score-in,.score-out{width:56px;height:40px;border-radius:7px;background:#060a12;border:1px solid #000;color:var(--led);font-family:var(--display);font-weight:800;font-size:25px;line-height:40px;text-align:center;text-shadow:0 0 8px rgba(255,180,58,.55);font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 7px rgba(0,0,0,.7)}
.score-in{padding:0;caret-color:var(--orange)}
.score-in::placeholder{color:rgba(255,180,58,.22);text-shadow:none}
.score-in:focus{outline:2px solid var(--orange);outline-offset:1px}
.score-out.empty{color:rgba(255,180,58,.25);text-shadow:none}
.line.lose .score-out{color:rgba(255,180,58,.5);text-shadow:none}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.actions .btn{flex:1 1 auto}
.err{margin:4px 0 0;font-size:13px;line-height:1.3;color:var(--loss)}
.err[hidden]{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:8px;border:1px solid var(--orange);padding:8px 14px;cursor:pointer;background:var(--orange);color:#1a0d02;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--muted);filter:none}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.danger{color:var(--loss);border-color:rgba(255,107,107,.45)}
.btn.danger:hover{color:#fff;border-color:var(--loss)}
.btn.armed{background:var(--loss);border-color:var(--loss);color:#fff}

/* Bracket */
.bracket-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px 22px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.85fr);column-gap:36px}
.round{display:flex;flex-direction:column;min-width:0}
.round-title{margin:0 0 6px;font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);height:22px}
.slots{flex:1;display:flex;flex-direction:column}
.slot{flex:1;display:flex;align-items:center;position:relative;padding:8px 0}
.slot>*{width:100%}
.r-qf .slot:nth-child(odd)::after,.r-sf .slot:nth-child(odd)::after{content:"";position:absolute;left:100%;top:50%;height:100%;width:18px;border:2px solid var(--line);border-left:0;border-radius:0 8px 8px 0}
.r-sf .slot::before,.r-f .slot::before{content:"";position:absolute;right:100%;top:50%;width:18px;border-top:2px solid var(--line)}
.r-f .slot::after{content:"";position:absolute;left:100%;top:50%;width:36px;border-top:2px solid var(--line)}
.champ{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 14px;border:2px dashed var(--line);border-radius:14px}
.champ svg{width:58px;height:58px;opacity:.35}
.champ-label{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.champ strong{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.champ.crowned{border:2px solid var(--gold);background:radial-gradient(circle at 50% 30%,rgba(255,198,74,.22),transparent 70%)}
.champ.crowned svg{opacity:1}
.champ.crowned strong{color:var(--gold);font-size:34px}

/* Schedule */
.schedule{display:flex;flex-direction:column;gap:8px}
.sch-head,.sch-row,.sch-end{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-items:stretch}
.sch-time-h{align-self:end;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px 8px}
.mini-court{grid-column:2/4;position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:12px;height:104px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8);
  background:
    radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.28),transparent 60%),
    repeating-linear-gradient(180deg,#d6a466 0 17px,#a86f34 17px 18px,#cb9454 18px 35px,#a86f34 35px 36px,#dcab6c 36px 53px,#a86f34 53px 54px,#c78d4c 54px 71px,#a86f34 71px 72px)}
.mini-court::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.85)}
.mini-court::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:radial-gradient(circle,var(--orange) 0 13px,transparent 14px)}
.half{position:relative;display:flex;align-items:center;justify-content:center;z-index:1}
.half::before{content:"";position:absolute;top:30%;bottom:30%;width:16%;border:3px solid rgba(255,255,255,.85);background:rgba(12,21,36,.18)}
.half.left::before{left:0;border-left:0}
.half.right::before{right:0;border-right:0}
.side-tag{position:relative;display:flex;flex-direction:column;align-items:center;background:rgba(10,17,29,.94);border-radius:10px;padding:7px 18px 6px;box-shadow:0 8px 18px -8px rgba(50,22,0,.7)}
.side-tag b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:var(--ink)}
.side-tag span{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--led);margin-top:2px}
.sch-time{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:9px 12px;background:#0a111d;border:1px solid var(--line);border-radius:10px}
.sch-time b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;color:var(--led);text-shadow:0 0 9px rgba(255,180,58,.5);font-variant-numeric:tabular-nums}
.sch-time span{font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.up{font-style:normal;font-family:var(--label);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#1a0d02;border-radius:4px;padding:1px 6px;margin-top:3px}
.sch-row.next .sch-time{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.sch-game{display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px 10px;text-decoration:none;color:inherit;transition:border-color .15s}
.sch-game:hover{border-color:var(--muted)}
.sch-row.next .sch-game{border-color:rgba(255,122,26,.6)}
.sg-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-family:var(--label);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sg-group{color:var(--orange)}
.sg-side{display:none}
.sg-top .tag{margin-left:auto}
.sline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:26px}
.sline .tname{font-size:15.5px}
.sline.win .tname{font-weight:700;color:#fff}
.sline.lose .tname{color:var(--muted)}
.sscore{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--led);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.sline.lose .sscore{color:rgba(255,180,58,.45)}
.sch-vs{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1}
.sch-end .sch-time{background:transparent;border-style:dashed}
.sch-end .sch-time b{font-size:24px;color:var(--muted);text-shadow:none}
.sch-end-note{grid-column:2/4;align-self:center;color:var(--muted);font-size:14.5px}

.sch-run{margin-top:6px;padding:4px 9px;font-size:11.5px}

/* Game mode */
.gm{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 80% at 50% 0%,#14223a 0,#070c16 62%);color:var(--ink)}
.gm-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 16px;background:rgba(7,12,22,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.gm-title{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase}
.gm-nav{display:flex;align-items:center;gap:10px;margin:0 auto}
.gm-nav-label{display:flex;flex-direction:column;align-items:center;min-width:170px}
.gm-nav-label b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--led);text-shadow:0 0 9px rgba(255,180,58,.5)}
.gm-nav-label span{font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.gm-arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.gm-arrow:hover{border-color:var(--orange)}
.gm-arrow[disabled]{opacity:.3;cursor:default}
.gm-tools{display:flex;gap:6px;flex-wrap:wrap}
.gm-body{max-width:1440px;margin:0 auto;padding:18px 16px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:18px}
.gm-body.single{max-width:760px;grid-template-columns:1fr}
.gm-foot{max-width:1440px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:14px;text-align:center}
.gp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gp-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.side-chip{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;background:var(--orange);color:#1a0d02;border-radius:6px;padding:3px 10px}
.gp-sub{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gp-head .tag{margin-left:auto}
.clock{position:relative;overflow:hidden;text-align:center;background:#04070d;border-radius:14px;padding:12px 10px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 6px 18px rgba(0,0,0,.6)}
.clock::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.42) .9px,transparent 1.4px);background-size:4px 4px}
.clock-digits{font-family:var(--display);font-weight:800;font-size:clamp(72px,8.5vw,120px);line-height:1;color:var(--led);text-shadow:0 0 18px rgba(255,180,58,.55);font-variant-numeric:tabular-nums}
.clock.low .clock-digits{color:#ff9d5c;text-shadow:0 0 18px rgba(255,140,70,.6)}
.clock.expired .clock-digits{color:var(--loss);text-shadow:0 0 18px rgba(255,107,107,.65);animation:blink 1s steps(2,start) 4}
.clock-label{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.clock.running .clock-label{color:var(--win)}
.clock.expired .clock-label{color:var(--loss)}
.clock-ctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btn.lg{padding:11px 22px;font-size:17px;min-width:140px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.teams2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tside{display:flex;flex-direction:column;gap:8px;text-align:center;min-width:0}
.tside-name{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-height:2.2em;font-family:var(--display);font-weight:800;font-size:clamp(20px,2vw,28px);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.tside-name .seed{font-size:13px}
.big-score{font-family:var(--display);font-weight:800;font-size:clamp(72px,8vw,108px);line-height:1;color:var(--led);background:#04070d;border-radius:12px;padding:10px 0 8px;text-shadow:0 0 16px rgba(255,180,58,.5);font-variant-numeric:tabular-nums;box-shadow:inset 0 6px 16px rgba(0,0,0,.6)}
.big-score.lead{color:#ffd27a}
.big-score.bump{animation:bump .25s ease-out}
.tside.lose .big-score{color:rgba(255,180,58,.45);text-shadow:none}
.tside.win .tside-name{color:#fff}
.tside.lose .tside-name{color:var(--muted)}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pt{height:48px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-family:var(--display);font-weight:800;font-size:23px;cursor:pointer;padding:0;touch-action:manipulation}
.pt:hover{border-color:var(--orange)}
.pt:active{background:rgba(255,122,26,.25)}
.pt.minus{color:var(--muted)}
.gp-save{display:flex;flex-direction:column;gap:6px}
.gp-save .btn{width:100%;padding:12px;font-size:16px}
.gp-save .err{text-align:center}
.gp-note{margin:0;font-size:13px;color:var(--muted);text-align:center}
.gp-wait{padding:34px 10px;text-align:center;color:var(--muted)}
.gp-wait strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@keyframes blink{50%{opacity:.3}}
@keyframes bump{from{transform:scale(1.08)}to{transform:scale(1)}}

/* Teams setup */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.tgroup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tgroup-title{display:flex;align-items:center;gap:10px;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tgroup-title .g-letter{font-size:40px;min-width:24px}
.tfield{display:flex;align-items:center;gap:10px}
.tnum{flex:none;width:28px;height:28px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--label);font-weight:700;font-size:14px;color:var(--muted)}
.tfield input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:600 16px var(--body);padding:10px 12px}
.tfield input::placeholder{color:#62738f;font-weight:500}
.tfield input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.teams-actions{grid-column:1/-1;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.teams-actions .err{margin:0}
.danger-zone{margin-top:28px;border:1px solid rgba(255,107,107,.25);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.danger-zone h3{margin:0;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.danger-zone p{margin:2px 0 0;color:var(--muted);font-size:14.5px}

/* Footer and toast */
.foot{max-width:1180px;margin:56px auto 0;padding:26px 16px 40px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px 28px;flex-wrap:wrap;font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.foot-crest{height:96px;width:auto;flex:none;opacity:.92}
.foot-txt{display:flex;flex-direction:column;gap:4px}
.foot-txt span:first-child{color:var(--ink)}
.hero-logo{display:block;margin:0 auto 14px;height:clamp(104px,12vw,160px);width:auto;filter:drop-shadow(0 10px 16px rgba(40,18,0,.45))}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:50;background:var(--ink);color:var(--court);font-weight:600;font-size:15px;padding:10px 18px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Update flash */
@keyframes rowflash{from{background:rgba(255,122,26,.32)}to{background:transparent}}
@keyframes boxflash{from{box-shadow:0 0 0 2px var(--orange),0 0 26px rgba(255,122,26,.55)}to{box-shadow:0 0 0 0 transparent}}
.standings tr.flash td{animation:rowflash 1.8s ease-out}
.game.flash{animation:boxflash 1.8s ease-out}

@media (max-width:860px){
  .bracket{grid-template-columns:1fr;row-gap:22px}
  .round-title{height:auto}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .slot{padding:0}
  .slot::before,.slot::after{display:none !important}
  .champ{flex-direction:row;justify-content:center;flex-wrap:wrap;padding:14px}
  .champ svg{width:40px;height:40px}
}
@media (max-width:700px){
  .sch-head,.sch-row,.sch-end{grid-template-columns:1fr;row-gap:8px}
  .sch-time-h{display:none}
  .mini-court{grid-column:1;height:92px}
  .side-tag{padding:6px 12px 5px}
  .side-tag b{font-size:22px}
  .sch-time{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
  .sch-time b{font-size:26px}
  .sg-side{display:inline}
  .sch-end-note{grid-column:1}
  .sch-row{padding-bottom:6px}
  .sch-run{margin:0 0 0 auto}
  .gm-title{font-size:20px}
  .gm-nav{order:3;width:100%;justify-content:space-between}
  .gm-tools{margin-left:auto}
  .gp{padding:12px}
}
@media (max-width:540px){
  .hero{padding-top:38px}
  .stat:last-child{grid-column:1/-1}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:330px;margin-left:auto;margin-right:auto}
  .stat{min-width:0;padding:8px 8px 7px}
  .stat b{font-size:30px}
  .stat span{font-size:11px;letter-spacing:.08em}
  .brand span{display:none}
  .standings th,.standings td{padding-left:7px;padding-right:7px}
  .info-card h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ribbon{height:auto;padding:8px 0}
  .ribbon-track{animation:none;width:auto;justify-content:center}
  .rseq{flex-wrap:wrap;justify-content:center;row-gap:6px}
  .rseq.dup{display:none}
  .ri{white-space:normal}
  .standings tr.flash td,.game.flash,.clock.expired .clock-digits,.big-score.bump{animation:none}
  .save-status::before{animation:none !important}
}
</style>
</head>

  if(local){var l=normalize(local);if(l.rev>state.rev){state=l;loadedFromLocal=true;}else lsDel(LS_STATE);}

})();

/* ---------- helpers ---------- */
function parseJSON(t){try{return JSON.parse(t);}catch(e){return null;}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isScore(n){return typeof n==='number'&&Math.floor(n)===n&&n>=0&&n<1000;}
function isResult(r){return !!r&&isScore(r.s1)&&isScore(r.s2)&&r.s1!==r.s2;}
function defaultName(id){return 'Team '+(GROUPS.indexOf(id[0])*3+Number(id[1]));}
function isDefault(id){return state.teams[id]===defaultName(id);}
function name(id){return state.teams[id]||defaultName(id);}
function fmtPd(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0';}
function fmtTime(min){var h=Math.floor(min/60)%12||12,m=min%60;return h+':'+(m<10?'0':'')+m;}
function slotStart(i){return START_MIN+i*SLOT_MIN;}
function gameTeams(id){var g=id[0],p=PAIRS[Number(id.split('-')[1])-1];return [g+p[0],g+p[1]];}
function nextSlot(){
  for(var i=0;i<SCHEDULE.length;i++){if(!isResult(state.games[SCHEDULE[i][0]])||!isResult(state.games[SCHEDULE[i][1]]))return i;}
  return -1;
}
function parseScore(v){v=String(v||'').trim();return /^\d{1,3}$/.test(v)?Number(v):null;}

function normalize(s){
  s=(s&&typeof s==='object')?s:{};
  var out={v:1,rev:Number(s.rev)||0,teams:{},games:{},ko:{}};
  GROUPS.forEach(function(g){[1,2,3].forEach(function(n){
    var id=g+n,nm=s.teams&&typeof s.teams[id]==='string'?s.teams[id].trim():'';
    out.teams[id]=nm?nm.slice(0,30):defaultName(id);
  });});
  var k,r;
  if(s.games)for(k in s.games){r=s.games[k];if(isResult(r))out.games[k]={s1:r.s1,s2:r.s2,at:Number(r.at)||0};}
  if(s.ko)for(k in s.ko){r=s.ko[k];if(isResult(r)&&r.t1&&r.t2)out.ko[k]={t1:String(r.t1),t2:String(r.t2),s1:r.s1,s2:r.s2,at:Number(r.at)||0};}
  return out;
}

/* ---------- standings + bracket logic ---------- */
function byTie(x,y){return y.pd-x.pd||y.pf-x.pf||x.seed-y.seed;}
function groupTable(g){
  var ids=[1,2,3].map(function(n){return g+n;});
  var rows={},h2h={},played=0;
  ids.forEach(function(id,i){rows[id]={id:id,seed:i,gp:0,w:0,l:0,pf:0,pa:0,pd:0};});
  PAIRS.forEach(function(p,i){
    var r=state.games[g+'-'+(i+1)];if(!isResult(r))return;
    played++;
    var a=rows[g+p[0]],b=rows[g+p[1]];
    a.gp++;b.gp++;a.pf+=r.s1;a.pa+=r.s2;b.pf+=r.s2;b.pa+=r.s1;
    var w=r.s1>r.s2?a.id:b.id;
    if(w===a.id){a.w++;b.l++;}else{b.w++;a.l++;}
    h2h[a.id+'|'+b.id]=w;h2h[b.id+'|'+a.id]=w;
  });
  var list=ids.map(function(id){var r=rows[id];r.pd=r.pf-r.pa;return r;});
  list.sort(function(x,y){return y.w-x.w||x.l-y.l||x.seed-y.seed;});
  var out=[];
  for(var i=0;i<list.length;){
    var j=i;while(j<list.length&&list[j].w===list[i].w&&list[j].l===list[i].l)j++;
    var bucket=list.slice(i,j);
    var hw=bucket.length===2?h2h[bucket[0].id+'|'+bucket[1].id]:null;
    if(hw)bucket.sort(function(x,y){return x.id===hw?-1:y.id===hw?1:0;});
    else bucket.sort(byTie);
    out=out.concat(bucket);i=j;
  }
  return {g:g,rows:out,played:played,complete:played===PAIRS.length};
}
function side(src,groups,ko){
  if(src.g){
    var t=groups[src.g];
    return {id:t.complete?t.rows[src.r-1].id:null,seed:src.r+src.g,label:'Group '+src.g+(src.r===1?' winner':' runner-up')};
  }
  return {id:ko[src.w].winner,seed:'',label:'Winner of '+KO_SHORT[src.w]};
}
function computeModel(){
  var groups={},ko={};
  GROUPS.forEach(function(g){groups[g]=groupTable(g);});
  KO.forEach(function(def){
    var a=side(def.a,groups,ko),b=side(def.b,groups,ko),r=state.ko[def.id];
    var result=(r&&a.id&&b.id&&r.t1===a.id&&r.t2===b.id)?r:null;
    ko[def.id]={def:def,a:a,b:b,result:result,winner:result?(result.s1>result.s2?a.id:b.id):null};
  });
  var played=0;
  GROUPS.forEach(function(g){played+=groups[g].played;});
  KO.forEach(function(d){if(ko[d.id].result)played++;});
  return {groups:groups,ko:ko,played:played,champion:ko.F.winner};
}

/* ---------- game mode ---------- */
function saveLive(){gm.at=Date.now();lsSet(LS_LIVE,{games:live,gm:gm,sound:sound});}
function liveOf(id){return live[id]||(live[id]={s1:0,s2:0,rem:CLOCK_MS,endsAt:0,running:false,expired:false});}
function remOf(l){return l.running?Math.max(0,l.endsAt-Date.now()):Math.max(0,l.rem);}
function anyRunning(){for(var k in live){if(live[k]&&live[k].running)return true;}return false;}
function fmtClock(ms){
  if(ms<=0)return '0:00';
  if(ms<60000){var t=Math.ceil(ms/100);if(t<600)return Math.floor(t/10)+'.'+(t%10);}
  var s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}
function curRound(){return ROUNDS[roundIndex(gm.round)]||null;}
function syncable(){
  var R=curRound();if(!R)return [];
  return R.games.map(function(g){return g.id;}).filter(function(id){var G=gmGame({id:id},model);return G.a&&G.b&&(!G.result||live[id]);});
}
function isSynced(){return !!(gm.synced&&gm.synced[gm.round]);}
function targets(id){if(!isSynced())return [id];var ids=syncable();return ids.indexOf(id)>=0?ids:[id];}
function roundIndex(key){for(var i=0;i<ROUNDS.length;i++)if(ROUNDS[i].key===key)return i;return -1;}
function defaultRound(m){
  var ns=nextSlot();if(ns>=0)return 's'+ns;
  for(var i=SCHEDULE.length;i<ROUNDS.length;i++){
    var open=ROUNDS[i].games.some(function(g){var k=m.ko[g.id];return k.a.id&&k.b.id&&!k.result;});
    if(open)return ROUNDS[i].key;
  }
  return m.champion?'f':'qf12';
}
function gmGame(g,m){
  var id=g.id;
  if(id.indexOf('-')>0){
    var tm=gameTeams(id),sl=SLOT_OF[id];
    return {id:id,a:tm[0],b:tm[1],result:isResult(state.games[id])?state.games[id]:null,head:'Side '+sl.side+' · '+SIDE_WHERE[sl.side],sub:'Group '+id[0]+' · '+fmtTime(slotStart(sl.slot))};
  }
  var k=m.ko[id];
  return {id:id,a:k.a.id,b:k.b.id,result:k.result,head:KO_LABEL[id],sub:k.a.seed?k.a.seed+' vs '+k.b.seed:'Bracket',aLabel:k.a.label,bLabel:k.b.label,seedA:k.a.seed,seedB:k.b.seed};
}
function gpHTML(G){
  var l=live[G.id];
  var head='<div class="gp-head"><span class="side-chip">'+esc(G.head)+'</span><span class="gp-sub">'+esc(G.sub)+'</span>'+(G.result&&!l?'<span class="tag final">Final saved</span>':'')+'</div>';
  if(!G.a||!G.b){
    return '<div class="gp">'+head+'<div class="gp-wait"><strong>Waiting on earlier results</strong>'+esc(G.aLabel)+' vs '+esc(G.bLabel)+'</div></div>';
  }
  if(G.result&&!l){
    var r=G.result;
    var fside=function(t,sc,win,seed){return '<div class="tside '+(win?'win':'lose')+'"><div class="tside-name">'+(seed?'<span class="seed">'+esc(seed)+'</span>':'')+esc(name(t))+'</div><div class="big-score">'+sc+'</div></div>';};
    return '<div class="gp">'+head+'<div class="teams2">'+fside(G.a,r.s1,r.s1>r.s2,G.seedA)+fside(G.b,r.s2,r.s2>r.s1,G.seedB)+'</div>'
      +'<div class="gp-save"><button class="btn ghost" type="button" data-gm="rescore" data-id="'+G.id+'">Fix this score</button></div></div>';
  }
  l=l||{s1:0,s2:0,rem:CLOCK_MS,running:false,expired:false};
  var rem=remOf(l),done=l.expired||rem<=0;
  var ccls='clock'+(l.running?' running':'')+(done?' expired':rem<60000?' low':'');
  var label=done?'Time’s up':l.running?'Clock running':(rem>=CLOCK_MS?'Ready':'Paused');
  if(isSynced()&&syncable().indexOf(G.id)>=0)label+=' · Synced';
  var toggle=l.running?'Pause':(rem>=CLOCK_MS?'Start clock':'Resume');
  var resetArmed=armed==='reset:'+G.id,saveArmed=armed==='final:'+G.id;
  var side=function(idx,t,sc,seed){
    var lead=idx===1?l.s1>l.s2:l.s2>l.s1;
    return '<div class="tside"><div class="tside-name">'+(seed?'<span class="seed">'+esc(seed)+'</span>':'')+esc(name(t))+'</div>'
      +'<div class="big-score'+(lead?' lead':'')+'" data-score="'+G.id+'-'+idx+'" aria-live="polite">'+sc+'</div>'
      +'<div class="pts">'+[1,2].map(function(v){return '<button class="pt" type="button" data-gm="pts" data-id="'+G.id+'" data-t="'+idx+'" data-v="'+v+'" aria-label="Add '+v+' for '+esc(name(t))+'">+'+v+'</button>';}).join('')
      +'<button class="pt minus" type="button" data-gm="pts" data-id="'+G.id+'" data-t="'+idx+'" data-v="-1" aria-label="Take 1 point away from '+esc(name(t))+'">−1</button></div></div>';
  };
  return '<div class="gp" data-gp="'+G.id+'">'+head
    +'<div class="'+ccls+'" data-clockbox="'+G.id+'"><div class="clock-digits" data-clock="'+G.id+'">'+fmtClock(rem)+'</div><div class="clock-label">'+label+'</div></div>'
    +'<div class="clock-ctrl">'
    +'<button class="btn lg" type="button" data-gm="toggle" data-id="'+G.id+'"'+(done?' disabled':'')+'>'+toggle+'</button>'
    +'<button class="btn ghost" type="button" data-gm="adj" data-id="'+G.id+'" data-v="-10000">−10 sec</button>'
    +'<button class="btn ghost" type="button" data-gm="adj" data-id="'+G.id+'" data-v="10000">+10 sec</button>'
    +'<button class="btn ghost'+(resetArmed?' armed':'')+'" type="button" data-gm="reset" data-id="'+G.id+'"'+(rem>=CLOCK_MS&&!l.running?' disabled':'')+'>'+(resetArmed?'Tap again to reset':'Reset to '+GAME_MIN+':00')+'</button>'
    +'</div>'
    +'<div class="teams2">'+side(1,G.a,l.s1,G.seedA)+side(2,G.b,l.s2,G.seedB)+'</div>'
    +'<div class="gp-save">'
    +'<button class="btn'+(saveArmed?' armed':'')+'" type="button" data-gm="final" data-id="'+G.id+'">'+(saveArmed?'Clock still has time. Tap again to save':'Save final score')+'</button>'
    +(G.result?'<p class="gp-note">A final score is already saved for this game. Saving again replaces it.</p>':'')
    +'<p class="err" role="alert" data-gmerr="'+G.id+'" hidden></p>'
    +'</div></div>';
}
function renderGM(){
  var slot=document.getElementById('gm-slot');if(!slot)return;
  if(!gm.open||readOnly){slot.innerHTML='';document.documentElement.style.overflow='';return;}
  var old=document.getElementById('gm'),top=old?old.scrollTop:0;
  var idx=roundIndex(gm.round);
  if(idx<0){gm.round=defaultRound(model);idx=roundIndex(gm.round);}
  var R=ROUNDS[idx],games=R.games.map(function(g){return gmGame(g,model);});
  slot.innerHTML='<div class="gm" id="gm" role="dialog" aria-modal="true" aria-label="Game mode">'
    +'<div class="gm-bar"><div class="gm-title">'+BALL+'Game mode</div>'
    +'<div class="gm-nav"><button class="gm-arrow" type="button" data-gm="prev" aria-label="Previous games"'+(idx===0?' disabled':'')+'>'+CHEV_L+'</button>'
    +'<div class="gm-nav-label"><b>'+esc(R.title)+'</b><span>'+esc(R.sub)+' · '+(idx+1)+' of '+ROUNDS.length+'</span></div>'
    +'<button class="gm-arrow" type="button" data-gm="next" aria-label="Next games"'+(idx===ROUNDS.length-1?' disabled':'')+'>'+CHEV_R+'</button></div>'
    +'<div class="gm-tools">'
    +(R.games.length>1?'<button class="btn sm'+(isSynced()?'':' ghost')+'" type="button" data-gm="sync" aria-pressed="'+isSynced()+'" title="Make both clocks show the same time and run together">'+(isSynced()?'Clocks synced':'Sync clocks')+'</button>':'')
    +'<button class="btn ghost sm" type="button" data-gm="sound" aria-pressed="'+sound+'">'+(sound?'Buzzer on':'Buzzer off')+'</button>'
    +'<button class="btn ghost sm" type="button" data-gm="fs">Full screen</button>'
    +'<button class="btn sm" type="button" data-gm="close">Close</button></div></div>'
    +'<div class="gm-body'+(games.length===1?' single':'')+'">'+games.map(gpHTML).join('')+'</div>'
    +'<p class="gm-foot">Live scores stay on this device. Tap Save final score when a game ends to send it to the standings.</p>'
    +'</div>';
  document.documentElement.style.overflow='hidden';
  var nu=document.getElementById('gm');if(nu&&top)nu.scrollTop=top;
}
function ensureTick(){
  if(tickTimer||!anyRunning())return;
  tickTimer=setInterval(tick,100);
}
function tick(){
  var needRender=false,still=false;
  for(var id in live){
    var l=live[id];if(!l||!l.running)continue;
    var rem=remOf(l);
    if(rem<=0){l.running=false;l.rem=0;l.expired=true;if(!needRender)buzz();needRender=true;}
    else{
      still=true;
      var el=document.querySelector('[data-clock="'+id+'"]');
      if(el){
        var txt=fmtClock(rem);if(el.textContent!==txt)el.textContent=txt;
        var box=el.parentNode;if(rem<60000&&!box.classList.contains('low'))box.classList.add('low');
      }
    }
  }
  if(needRender){saveLive();renderGM();}
  if(!still){clearInterval(tickTimer);tickTimer=null;releaseWake();}
}
function unlockAudio(){
  try{
    if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function buzz(){
  if(!sound||!audioCtx)return;
  try{
    var t=audioCtx.currentTime,g=audioCtx.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.03);
    g.gain.setValueAtTime(0.12,t+1.2);g.gain.exponentialRampToValueAtTime(0.0001,t+1.45);
    g.connect(audioCtx.destination);
    [196,247,294].forEach(function(f){var o=audioCtx.createOscillator();o.type='square';o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+1.5);});
  }catch(e){}
}
function keepAwake(){
  try{
    if(navigator.wakeLock&&!wakeLock){
      navigator.wakeLock.request('screen').then(function(s){wakeLock=s;s.addEventListener('release',function(){wakeLock=null;});}).catch(function(){});
    }
  }catch(e){}
}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
function arm(key){
  armed=key;clearTimeout(armTimer);
  armTimer=setTimeout(function(){armed=null;renderGM();},4000);
  renderGM();
}
function gmErr(id,msg,withOT){
  var p=document.querySelector('[data-gmerr="'+id+'"]');if(!p)return;
  p.innerHTML=esc(msg)+(withOT?' <button class="btn sm" type="button" data-gm="adj" data-id="'+id+'" data-v="60000">Add 1:00 overtime</button>':'');
  p.hidden=false;
}
var FS_MSG='Full screen isn’t available here. Your browser’s own full-screen mode works too.';
function gmAction(b){
  var act=b.getAttribute('data-gm'),id=b.getAttribute('data-id'),l;
  if(act==='open'){
    gm.open=true;gm.round=b.getAttribute('data-round')||defaultRound(model);armed=null;
    saveLive();renderGM();ensureTick();return;
  }
  if(act==='close'){
    gm.open=false;saveLive();
    try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
    renderGM();return;
  }
  if(act==='prev'||act==='next'){
    var i=roundIndex(gm.round)+(act==='next'?1:-1);
    if(i>=0&&i<ROUNDS.length){gm.round=ROUNDS[i].key;armed=null;saveLive();renderGM();var gEl=document.getElementById('gm');if(gEl)gEl.scrollTop=0;}
    return;
  }
  if(act==='sync'){
    gm.synced=gm.synced||{};
    if(isSynced()){
      gm.synced[gm.round]=false;saveLive();renderGM();
      toast('Clocks unsynced. Each game has its own clock again.');return;
    }
    var ids=syncable();
    if(ids.length<2){toast('Both games need their teams set before the clocks can sync.');return;}
    var ls=ids.map(liveOf),run=ls.filter(function(q){return q.running;});
    var master=run.length===1?run[0]:ls[0];
    var mrem=remOf(master),going=master.running,now=Date.now();
    ls.forEach(function(q){
      q.expired=mrem<=0;
      if(going){q.running=true;q.endsAt=now+mrem;}else{q.running=false;q.rem=mrem;}
    });
    gm.synced[gm.round]=true;saveLive();renderGM();ensureTick();
    toast('Clocks synced at '+fmtClock(mrem)+'. Start, pause, time changes and reset now control both games.');
    return;
  }
  if(act==='sound'){sound=!sound;if(sound)unlockAudio();saveLive();renderGM();return;}
  if(act==='fs'){
    var el=document.getElementById('gm');
    try{
      if(document.fullscreenElement){document.exitFullscreen();return;}
      if(el.requestFullscreen){var p=el.requestFullscreen();if(p&&p.catch)p.catch(function(){toast(FS_MSG);});}
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
      else toast(FS_MSG);
    }catch(e){toast(FS_MSG);}
    return;
  }
  if(!id)return;
  if(act==='pts'){
    l=liveOf(id);var k='s'+b.getAttribute('data-t'),v=Number(b.getAttribute('data-v'));
    l[k]=Math.max(0,Math.min(999,l[k]+v));saveLive();
    var s1=document.querySelector('[data-score="'+id+'-1"]'),s2=document.querySelector('[data-score="'+id+'-2"]');
    if(s1&&s2){
      s1.textContent=l.s1;s2.textContent=l.s2;
      s1.classList.toggle('lead',l.s1>l.s2);s2.classList.toggle('lead',l.s2>l.s1);
      var hit=k==='s1'?s1:s2;hit.classList.remove('bump');void hit.offsetWidth;hit.classList.add('bump');
    }
    var pe=document.querySelector('[data-gmerr="'+id+'"]');if(pe)pe.hidden=true;
    return;
  }
  var tg=targets(id),nowT=Date.now();
  if(act==='toggle'){
    unlockAudio();l=liveOf(id);
    if(l.running){
      var rp=remOf(l);
      tg.forEach(function(x){var q=liveOf(x);q.rem=rp;q.running=false;});
    }else{
      var rs=remOf(l);
      if(rs>0){tg.forEach(function(x){var q=liveOf(x);q.rem=rs;q.endsAt=nowT+rs;q.running=true;q.expired=false;});keepAwake();}
    }
    saveLive();renderGM();ensureTick();return;
  }
  if(act==='adj'){
    unlockAudio();l=liveOf(id);
    var r=Math.max(0,Math.min(99*60000,remOf(l)+Number(b.getAttribute('data-v')))),wasRunning=l.running;
    tg.forEach(function(x){
      var q=liveOf(x);
      if(wasRunning){if(r<=0){q.running=false;q.rem=0;q.expired=true;}else{q.running=true;q.endsAt=nowT+r;q.expired=false;}}
      else{q.running=false;q.rem=r;q.expired=r<=0;}
    });
    saveLive();renderGM();ensureTick();return;
  }
  if(act==='reset'){
    if(armed!=='reset:'+id){arm('reset:'+id);return;}
    armed=null;
    tg.forEach(function(x){var q=liveOf(x);q.rem=CLOCK_MS;q.running=false;q.expired=false;});
    saveLive();renderGM();return;
  }
  if(act==='rescore'){
    var G=gmGame({id:id},model);
    if(!G.result)return;
    live[id]={s1:G.result.s1,s2:G.result.s2,rem:0,endsAt:0,running:false,expired:true};
    saveLive();renderGM();return;
  }
  if(act==='final'){
    l=liveOf(id);
    if(l.s1===l.s2){gmErr(id,'It’s tied, and games can’t end in a tie. Play overtime, then save.',true);return;}
    if(remOf(l)>0&&armed!=='final:'+id){arm('final:'+id);return;}
    armed=null;
    var a=l.s1,c=l.s2,G2=gmGame({id:id},model);
    if(recordResult(id,a,c)){
      var aw=a>c;
      toast('Final saved: '+name(aw?G2.a:G2.b)+' '+Math.max(a,c)+', '+name(aw?G2.b:G2.a)+' '+Math.min(a,c));
    }
    return;
  }
}

function applyFlash(){
  var f=ui.flash;
  if(!f||Date.now()-f.at>4000)return;
  var box=document.querySelector('[data-box="'+f.id+'"]');
  if(box)box.classList.add('flash');
  if(f.group){
    var rows=document.querySelectorAll('#group-'+f.group+' tbody tr');
    for(var i=0;i<rows.length;i++)rows[i].classList.add('flash');
  }
}

function setStatus(s){
  status=s;
  var el=document.getElementById('save-status');
  if(el){el.setAttribute('data-s',s);el.textContent=STATUS_TEXT[s];}
}
function toast(msg){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3600);
}
function showErr(id,msg){
  var box=document.querySelector('[data-box="'+id+'"]');if(!box)return;
  var p=box.querySelector('.err');p.textContent=msg;p.hidden=false;
}
function hideErr(id){
  var box=document.querySelector('[data-box="'+id+'"]');if(!box)return;
  var p=box.querySelector('.err');if(p&&!p.hidden){p.hidden=true;p.textContent='';}
}

/* ---------- actions ---------- */
function saveGame(id){
  var i1=document.getElementById('sc-'+id+'-1'),i2=document.getElementById('sc-'+id+'-2');
  if(!i1||!i2)return;
  var s1=parseScore(i1.value),s2=parseScore(i2.value);
  if(s1===null||s2===null){showErr(id,'Enter both scores as whole numbers.');(s1===null?i1:i2).focus();return;}
  if(s1===s2){showErr(id,'Basketball games can\'t end in a tie. Enter the final score after overtime.');i1.focus();return;}
  recordResult(id,s1,s2);
}
function recordResult(id,s1,s2){
  var isGroup=id.indexOf('-')>0;
  if(isGroup){state.games[id]={s1:s1,s2:s2,at:Date.now()};}
  else{
    var k=computeModel().ko[id];
    if(!k.a.id||!k.b.id)return false;
    state.ko[id]={t1:k.a.id,t2:k.b.id,s1:s1,s2:s2,at:Date.now()};
  }
  if(live[id]){delete live[id];saveLive();}
  delete ui.drafts[id];delete ui.editing[id];
  ui.flash={id:id,group:isGroup?id[0]:null,at:Date.now()};
  commit();
  return true;
}
function clearGame(id){
  if(id.indexOf('-')>0)delete state.games[id];else delete state.ko[id];
  delete ui.drafts[id];delete ui.editing[id];
  ui.flash={id:id,group:id.indexOf('-')>0?id[0]:null,at:Date.now()};
  commit();
  toast('Score cleared');
}
function saveTeams(){
  var next={},seen={},dup=null;
  GROUPS.forEach(function(g){[1,2,3].forEach(function(n){
    var id=g+n,el=document.getElementById('team-'+id);
    var v=el?el.value.replace(/\s+/g,' ').trim().slice(0,30):'';
    next[id]=v||defaultName(id);
    var key=next[id].toLowerCase();
    if(seen[key]&&!dup)dup=next[id];
    seen[key]=true;
  });});
  var err=document.getElementById('teams-err');
  if(dup){err.textContent='Two teams are named "'+dup+'". Give each team its own name.';err.hidden=false;return;}
  state.teams=next;ui.teamDrafts={};
  ui.notice={msg:'Team names saved',at:Date.now()};
  commit();
  toast('Team names saved');
}
function resetScores(btn){
  if(!confirmReset){
    confirmReset=true;btn.textContent='Tap again to erase all scores';btn.classList.add('armed');
    clearTimeout(resetTimer);
    resetTimer=setTimeout(function(){confirmReset=false;var b=document.querySelector('[data-act="reset"]');if(b){b.textContent='Reset all scores';b.classList.remove('armed');}},5000);
    return;
  }
  confirmReset=false;clearTimeout(resetTimer);
  state.games={};state.ko={};ui.editing={};ui.drafts={};live={};saveLive();
  ui.notice={msg:'All scores erased',at:Date.now()};
  commit();
  toast('All scores erased');
}

function commit(){
  state.rev=(state.rev||0)+1;
  render();
  if(readOnly)return;
  setStatus('saving');
  clearTimeout(pubTimer);
  pubTimer=setTimeout(publishNow,450);
}

/* ---------- saving: the page republishes itself with the new results inside ---------- */
function getArtifact(){
  if(artP)return artP;
  if(!(window.claude&&typeof window.claude.use==='function'))return Promise.resolve(null);
  artP=Promise.resolve().then(function(){return window.claude.use('artifact');}).catch(function(){return null;});
  return artP;
}
function buildDoc(s){
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Junior Boy Basketball Tournament</title>\n'
    +FONT_LINKS+'\n<style id="app-style">'+STYLE_SRC+'</style>\n</head>\n<body>\n<div id="app"></div>\n'
    +'<script type="application/json" id="tourney-state">'+json+'</'+'script>\n'
    +(ASSETS_SRC?'<script id="app-assets">'+ASSETS_SRC+'</'+'script>\n':'')
    +'<script id="app-code">'+CODE_SRC+'</'+'script>\n</body>\n</html>\n';
}
function errText(e){
  if(!e)return '';
  return [e.code,e.name,e.message,e.reason,String(e)].filter(Boolean).join(' ');
}
function publishNow(){
  getArtifact().then(function(art){
    if(!art){lsSet(LS_STATE,state);setStatus('local');return;}
    saveUiSession();
    return art.publish(buildDoc(state)).then(function(){
      lsDel(LS_STATE);setStatus('saved');
    },function(e){
      var t=errText(e);
      if(/not_granted|not_writer/.test(t)){
        readOnly=true;lsSet(LS_RO,'1');
        state=clone(embedded);ui.editing={};ui.drafts={};
        render();setStatus('readonly');
        toast('View only: the organizer enters the scores');
      }else if(/conflict/i.test(t)){
        setStatus('saving');
      }else{
        lsSet(LS_STATE,state);setStatus('error');
        toast('Couldn\'t save to the shared page. Your scores are kept on this device for now.');
      }
    });
  });
}

/* ---------- keep drafts and place across reloads ---------- */
function uiSnapshot(){return {drafts:ui.drafts,editing:ui.editing,teamDrafts:ui.teamDrafts,flash:ui.flash,notice:ui.notice};}
function saveUiSession(){try{sessionStorage.setItem(SS_UI,JSON.stringify(uiSnapshot()));}catch(e){}}
function readUiSession(){try{var v=sessionStorage.getItem(SS_UI);sessionStorage.removeItem(SS_UI);return v?JSON.parse(v):null;}catch(e){return null;}}

/* ---------- events ---------- */
function bind(){
  $app.addEventListener('click',function(e){
    var g=e.target.closest('[data-gm]');
    if(g){if(!g.disabled)gmAction(g);return;}
    var b=e.target.closest('[data-act]');if(!b)return;
    var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
    if(act==='save')saveGame(id);
    else if(act==='edit'){ui.editing[id]=true;render();var f=document.getElementById('sc-'+id+'-1');if(f){f.focus();f.select();}}
    else if(act==='cancel'){delete ui.editing[id];delete ui.drafts[id];render();}
    else if(act==='clear')clearGame(id);
    else if(act==='reset')resetScores(b);
    else if(act==='try-edit'){readOnly=false;lsDel(LS_RO);render();getArtifact().then(function(a){setStatus(a?'saved':'local');});}
  });
  $app.addEventListener('input',function(e){
    var t=e.target;
    if(t.classList.contains('score-in')){
      var clean=t.value.replace(/\D/g,'').slice(0,3);
      if(clean!==t.value)t.value=clean;
      var id=t.getAttribute('data-game');
      var d=ui.drafts[id]||(ui.drafts[id]={});
      d['s'+t.getAttribute('data-idx')]=t.value;
      hideErr(id);
    }else if(t.hasAttribute('data-team')){
      ui.teamDrafts[t.getAttribute('data-team')]=t.value;
      var err=document.getElementById('teams-err');if(err)err.hidden=true;
    }
  });
  $app.addEventListener('keydown',function(e){
    var t=e.target;
    if(e.key==='Enter'&&t.classList&&t.classList.contains('score-in')){e.preventDefault();saveGame(t.getAttribute('data-game'));}
    else if(e.key==='Escape'&&gm.open&&!document.fullscreenElement){gm.open=false;saveLive();renderGM();}
  });
  $app.addEventListener('submit',function(e){
    if(e.target.id==='teams-form'){e.preventDefault();saveTeams();}
  });
}

function start(data){
  data=(data&&typeof data==='object'&&Object.keys(data).length)?data:(readUiSession()||{});
  ui.drafts=data.drafts||{};ui.editing=data.editing||{};ui.teamDrafts=data.teamDrafts||{};
  ui.flash=data.flash||null;ui.notice=data.notice||null;
  $app.innerHTML='<div id="ribbon-slot"></div><div id="main-slot"></div><div id="gm-slot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
  bind();
  render();
  ensureTick();
  if(ui.notice&&Date.now()-ui.notice.at<4000)toast(ui.notice.msg);
  if(readOnly){setStatus('readonly');return;}
  setTimeout(function(){
    getArtifact().then(function(a){
      if(readOnly)return setStatus('readonly');
      setStatus(!a||loadedFromLocal?'local':'saved');
    });
  },0);
}

var hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function'){try{hot.snapshot(uiSnapshot);}catch(e){}}
if(hot&&typeof hot.ready==='function')hot.ready(start);
else start((hot&&hot.data)||{});
})();
</script>
